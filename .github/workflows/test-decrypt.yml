name: test-decrypt
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: macos-26
    steps:
      - name: Decrypt variants
        env:
          ARTIFACT_KEY: ${{ secrets.ARTIFACT_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          openssl version || true
          brew list openssl 2>/dev/null && ls /opt/homebrew/opt/openssl@3/bin 2>/dev/null || true
          gh release download root-policies-macos -R "$GITHUB_REPOSITORY" --pattern verified-root-inputs.tar.enc --dir "$RUNNER_TEMP"
          F="$RUNNER_TEMP/verified-root-inputs.tar.enc"
          ls -la "$F"
          test_variant() {
            local label="$1"; shift
            openssl enc -d -aes-256-cbc -pbkdf2 "$@" -pass env:ARTIFACT_KEY -in "$F" -out "$RUNNER_TEMP/out.bin" 2>/dev/null && \
              printf '%s -> %s\n' "$label" "$(head -c 4 "$RUNNER_TEMP/out.bin" | od -An -tx1 | tr -d ' \n')" || \
              printf '%s -> DECRYPT-FAIL\n' "$label"
          }
          test_variant "default"
          test_variant "-iter10000" -iter 10000
          test_variant "-md-sha256" -md sha256
          test_variant "-iter10000-md-sha256" -iter 10000 -md sha256
          test_variant "-iter2048" -iter 2048
          test_variant "-iter10000-sha1" -iter 10000 -md sha1
          test_variant "-iter100000" -iter 100000
