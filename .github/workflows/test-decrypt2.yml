name: test-decrypt2
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: macos-26
    steps:
      - name: Matrix
        env:
          ARTIFACT_KEY: ${{ secrets.ARTIFACT_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          which openssl; openssl version
          printf 'key len(env)=%s\n' "${#ARTIFACT_KEY}"
          printf '%s' "$ARTIFACT_KEY" | od -c | tail -2
          printf '%s' "$ARTIFACT_KEY" > "$RUNNER_TEMP/kf"
          printf 'key len(file)=%s\n' "$(wc -c < "$RUNNER_TEMP/kf" | tr -d ' ')"
          gh release download root-policies -R "$GITHUB_REPOSITORY" --pattern owner-keys.tar.enc --dir "$RUNNER_TEMP"
          gh release download root-policies-macos -R "$GITHUB_REPOSITORY" --pattern verified-root-inputs.tar.enc --dir "$RUNNER_TEMP"
          probe() {
            local label="$1" file="$2"; shift 2
            head -c 2 "$RUNNER_TEMP/p.out" 2>/dev/null | od -An -tx1 | grep -q "1f 8b" && r=GZIP-OK || r=NOT-GZIP
            if openssl enc -d -aes-256-cbc -pbkdf2 "$@" -in "$file" -out "$RUNNER_TEMP/p.out" 2>"$RUNNER_TEMP/p.err"; then
              if head -c 2 "$RUNNER_TEMP/p.out" | od -An -tx1 | grep -q "1f 8b"; then
                printf '%s -> GZIP-OK\n' "$label"
              else
                printf '%s -> NO-GZIP head=%s\n' "$label" "$(head -c 8 "$RUNNER_TEMP/p.out" | od -An -tx1 | tr -d ' \n')"
              fi
            else
              printf '%s -> OPENSSL-ERR: %s\n' "$label" "$(tail -1 "$RUNNER_TEMP/p.err")"
            fi
          }
          OK="$RUNNER_TEMP/owner-keys.tar.enc"
          VRI="$RUNNER_TEMP/verified-root-inputs.tar.enc"
          probe "owner-keys env"       "$OK" -pass env:ARTIFACT_KEY
          probe "owner-keys file"      "$OK" -pass file:"$RUNNER_TEMP/kf"
          probe "vri env"              "$VRI" -pass env:ARTIFACT_KEY
          probe "vri file"             "$VRI" -pass file:"$RUNNER_TEMP/kf"
          probe "vri env it10k"        "$VRI" -pass env:ARTIFACT_KEY -iter 10000
          probe "vri env md256"        "$VRI" -pass env:ARTIFACT_KEY -md sha256
          probe "vri env it10k md256"  "$VRI" -pass env:ARTIFACT_KEY -iter 10000 -md sha256
          probe "vri env sha1"         "$VRI" -pass env:ARTIFACT_KEY -md sha1
          probe "vri env it100k"       "$VRI" -pass env:ARTIFACT_KEY -iter 100000
